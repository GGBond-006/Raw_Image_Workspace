<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoShot 生图台 · 跨境电商批量套图</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <!-- 左侧固定导航 -->
  <aside class="sb">
    <div class="sb-logo">
      <div class="logo-mark" id="logoMark"></div>
      <div>
        <div class="sb-title">AutoShot 生图台</div>
        <div class="sb-sub">跨境电商批量套图</div>
      </div>
    </div>

    <div class="sb-search" id="sbSearchBtn" title="快捷搜索当前任务图片 (Ctrl+K)">
      <span class="ic-slot" data-ic="search" data-sz="14"></span>
      <span>搜索 SKU / 文件名</span>
      <span class="kbd">Ctrl K</span>
    </div>

    <nav class="sb-nav">
      <button class="nav" data-nav="dashboard"><span class="ic-slot" data-ic="grid"></span><span>工作台</span></button>
      <button class="nav on" data-nav="tasks"><span class="ic-slot" data-ic="layers"></span><span>生图任务</span><span class="cnt" id="navTaskCount">1</span></button>
      <button class="nav" data-nav="assets"><span class="ic-slot" data-ic="image"></span><span>素材库</span></button>
      <button class="nav" data-nav="brands"><span class="ic-slot" data-ic="tag"></span><span>品牌 LOGO 库</span></button>
      <button class="nav" data-nav="templates"><span class="ic-slot" data-ic="file"></span><span>提示词模板</span></button>
      <button class="nav" data-nav="providers"><span class="ic-slot" data-ic="cpu"></span><span>生图平台</span></button>
    </nav>

    <div class="sb-sec">当前任务</div>
    <div id="recentTasksList" class="recent-list"></div>

    <div class="sb-foot">
      <div class="status-card" id="sidebarProviderCard" title="点击配置生图平台与 API 令牌">
        <div class="row sb-st-top">
          <span>生图平台</span>
          <span class="row sb-st-badge" id="sbProviderStatus"><span class="dot"></span>正常</span>
        </div>
        <div class="sb-st-name" id="sbProviderName">球球Token</div>
        <div class="mono sb-st-meta" id="sbProviderMeta">gpt-image-2 · 平均 21s / 张</div>
      </div>
      <div class="user">
        <div class="avatar">王</div>
        <div class="user-info">
          <div class="user-name">运营 · 美工组</div>
          <div class="user-role">本地直连引擎</div>
        </div>
        <button class="icon-btn" id="openProviderModalBtn" title="平台与令牌设置">
          <span class="ic-slot" data-ic="sliders" data-sz="15"></span>
        </button>
      </div>
    </div>
  </aside>

  <!-- 主内容容器 -->
  <main class="main">
    <!-- 顶部页头 -->
    <header class="hd">
      <div class="hd-left">
        <div class="crumb">
          <span>生图任务</span>
          <span class="ic-slot" data-ic="chev-r" data-sz="12"></span>
          <span id="hdSpu" class="mono">RC4661</span>
        </div>
        <div class="hd-title">
          <span id="hdTitle">加载中...</span>
          <span class="pill p-gray" id="hdBrandPill">RadioMaster</span>
        </div>
      </div>

      <!-- 三步步骤条（支持直接点击切换体验） -->
      <div class="stepper" id="stepper">
        <button class="st on" data-step="1"><span class="n">1</span><span>导入素材</span></button>
        <div class="st-line" id="stLine1"></div>
        <button class="st" data-step="2"><span class="n">2</span><span>核对参数</span></button>
        <div class="st-line" id="stLine2"></div>
        <button class="st" data-step="3"><span class="n">3</span><span>生成与验收</span></button>
      </div>

      <!-- 第三步专属右上角主操作区（固定占右列，紧凑不挤压中间步骤条） -->
      <div class="hd-right">
        <div class="hd-actions hidden" id="step3HeaderActions">
          <button class="btn btn-s" id="btnOpenOutputDir" title="在资源管理器中打开输出目录">
            <span class="ic-slot" data-ic="folder" data-sz="14"></span>
            <span>目录</span>
          </button>
          <button class="btn btn-p" id="btnExportTongtool">
            <span class="ic-slot" data-ic="download" data-sz="14"></span>
            <span>导出图库包</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 三步视图区 -->
    <div class="content" id="viewRoot">
      <!-- STEP 1: 导入素材 -->
      <section class="step-view" id="stepView1"></section>
      <!-- STEP 2: 核对参数 -->
      <section class="step-view hidden" id="stepView2"></section>
      <!-- STEP 3: 生成与验收 -->
      <section class="step-view hidden" id="stepView3"></section>
    </div>

    <!-- 底部操作栏（第一步、第二步显示） -->
    <footer class="ft" id="bottomFooter"></footer>
  </main>

  <!-- 通用弹窗层 -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modalBox">
      <div class="modal-hd">
        <div class="modal-title" id="modalTitle">标题</div>
        <button class="icon-btn" id="modalCloseBtn"><span class="ic-slot" data-ic="x" data-sz="18"></span></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-ft" id="modalFooter"></div>
    </div>
  </div>

  <!-- 高清图片灯箱 -->
  <div class="lightbox hidden" id="lightbox">
    <div class="lb-bar">
      <div class="lb-info">
        <span class="mono" id="lbTitle"></span>
        <span class="lb-sub" id="lbMeta"></span>
      </div>
      <div class="row" style="gap:8px">
        <a class="btn btn-s btn-sm" id="lbDownload" download>下载原图</a>
        <button class="btn btn-s btn-sm" id="lbCloseBtn">关闭 (ESC)</button>
      </div>
    </div>
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="预览" />
    </div>
  </div>

  <!-- Toast 轻量提示 -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="/static/app.js"></script>
</body>
</html>
